<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">方案 3：Cloudflare China Network</title>
  <desc id="desc">展示 01mvp.com 使用 Cloudflare 官方中国网络时的简化访问链路。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; fill: #475569; }
      .box-title { font: 700 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; fill: #0f172a; }
      .box-text { font: 500 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; fill: #334155; }
      .box { stroke: #cbd5e1; stroke-width: 2; rx: 22; ry: 22; }
      .blue { fill: #e0f2fe; }
      .amber { fill: #fef3c7; }
      .green { fill: #dcfce7; }
      .orange { fill: #ffedd5; }
      .alert { fill: #fee2e2; stroke: #ef4444; stroke-width: 2; rx: 18; ry: 18; }
      .alert-text { font: 700 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; fill: #991b1b; }
      .arrow { stroke: #0f172a; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="520"/>

  <text class="title" x="70" y="70">方案 3 · Cloudflare China Network（官方，但现在先跳过）</text>
  <text class="subtitle" x="70" y="108">一句话理解：这是 Cloudflare 官方中国网络，路子最正，但门槛也最高。</text>

  <rect class="alert" x="70" y="145" width="620" height="74"/>
  <text class="alert-text" x="100" y="190">前提：Enterprise + China Network 单独订阅 + ICP + 内容审核</text>

  <rect class="box blue" x="70" y="280" width="240" height="120"/>
  <text class="box-title" x="100" y="322">1. 用户访问</text>
  <text class="box-text" x="100" y="356">www.01mvp.com</text>

  <rect class="box amber" x="390" y="280" width="290" height="120"/>
  <text class="box-title" x="420" y="322">2. 中国 DNS / NS</text>
  <text class="box-text" x="420" y="356">Cloudflare + JD Cloud</text>

  <rect class="box green" x="760" y="260" width="330" height="160"/>
  <text class="box-title" x="790" y="302">3. 中国边缘节点</text>
  <text class="box-text" x="790" y="338">Cloudflare China Network</text>
  <text class="box-text" x="790" y="366">在中国境内交付缓存和安全能力</text>

  <rect class="box orange" x="1170" y="260" width="320" height="160"/>
  <text class="box-title" x="1200" y="302">4. Worker / Cache / WAF</text>
  <text class="box-text" x="1200" y="338">继续用 Cloudflare 体系</text>
  <text class="box-text" x="1200" y="366">官方、合规、长期方案</text>

  <path class="arrow" d="M310 340 L390 340"/>
  <path class="arrow" d="M680 340 L760 340"/>
  <path class="arrow" d="M1090 340 L1170 340"/>
</svg>
